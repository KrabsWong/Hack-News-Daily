# HackerNews Daily - Docker Compose 配置
# 一次性任务执行方案
# 
# 使用方式：
# 1. 在项目根目录复制 deploy/.env.example 到 .env 并填写配置
# 2. npm run build
# 3. docker compose -f deploy/docker-compose.yml run --rm hackernews-daily
# 4. 配置 crontab 定时执行

version: '3.8'

services:
  hackernews-daily:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: hackernews-daily
    restart: "no"
    env_file:
      - ../.env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
